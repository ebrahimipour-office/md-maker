[project]
name = "md-maker"
version = "0.2.0"
description = "Convert PDF and DOCX files to token-cheap Markdown, with Persian support and Claude-assisted repair of hard pages"
readme = "README.md"
authors = [
    { name = "ebrahimipour", email = "ebrahimipour@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=2",
    "pypandoc-binary>=1.17",
]

[project.scripts]
md-maker = "md_maker:main"
md-maker-gui = "md_maker.gui:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
]
